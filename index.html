<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة رأس المال | Capital Manager</title>
<style>
  :root{--bg:#0f1720;--panel:#17212b;--panel2:#1e2b38;--line:#2a3a4a;--txt:#e6eef7;--muted:#8fa3b8;--accent:#22c1a4;--accent2:#3b82f6;--danger:#ef4444;--ok:#22c55e;--gold:#eab308;--shadow:rgba(0,0,0,.35);}
  html[data-theme="light"]{--bg:#f0f4f8;--panel:#ffffff;--panel2:#e8eef5;--line:#cbd5e1;--txt:#0f172a;--muted:#64748b;--accent:#0891b2;--accent2:#2563eb;--danger:#dc2626;--ok:#16a34a;--gold:#d97706;--shadow:rgba(0,0,0,.12);}
  *{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI","Tahoma",sans-serif}
  html,body{height:100%}
  body{background:var(--bg);color:var(--txt);min-height:100vh;font-size:14px;transition:background .3s,color .3s}
  header{background:linear-gradient(90deg,var(--panel),var(--panel2));border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;gap:12px;flex-wrap:wrap}
  header h1{font-size:17px;color:var(--accent);display:flex;align-items:center;gap:8px;white-space:nowrap}
  .toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .save-indicator{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;background:var(--bg);border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--ok);white-space:nowrap;transition:.3s;font-family:monospace}
  .year-picker{display:flex;align-items:center;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px 6px}
  .year-picker select{background:transparent;border:none;color:var(--gold);font-weight:700;font-size:15px;padding:4px 6px;outline:none;cursor:pointer;font-family:inherit}
  .year-picker button{background:transparent;border:none;color:var(--muted);padding:4px 8px;border-radius:6px;cursor:pointer;font-size:15px;font-weight:700;transition:.2s}
  .year-picker button:hover{background:var(--accent);color:#fff}
  .btn{background:var(--panel2);color:var(--txt);border:1px solid var(--line);padding:7px 12px;border-radius:8px;cursor:pointer;font-size:13px;transition:.2s;white-space:nowrap}
  .btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn.danger{background:transparent;color:var(--danger);border-color:var(--danger)}
  .btn.danger:hover{background:var(--danger);color:#fff}
  .settings-bar{display:flex;gap:4px;padding:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px}
  .settings-bar button{background:transparent;border:none;color:var(--muted);padding:6px 10px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:700;transition:.2s}
  .settings-bar button:hover{background:var(--accent);color:#fff}
  nav.tabs{display:flex;gap:4px;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto}
  nav.tabs button{background:transparent;border:none;color:var(--muted);padding:8px 16px;border-radius:8px;cursor:pointer;font-size:14px;white-space:nowrap;font-weight:500;transition:.2s}
  nav.tabs button.active{background:var(--accent);color:#fff}
  nav.tabs button:hover:not(.active){background:var(--panel2);color:var(--txt)}
  main{padding:20px;max-width:1400px;margin:0 auto}
  .view{display:none}
  .view.active{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
  .card h2{font-size:16px;color:var(--accent);margin-bottom:14px;display:flex;align-items:center;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--line)}
  .card h2::before{content:"●";color:var(--accent);font-size:10px}
  .grid{display:grid;gap:12px}
  .g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:600px){.g4,.g3,.g2{grid-template-columns:1fr}}
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:12px;color:var(--muted)}
  .field input,.field select,.field textarea{background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:9px 12px;border-radius:8px;font-size:14px;outline:none;transition:.2s;font-family:inherit}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(34,193,164,.15)}
  .field input[readonly]{background:var(--bg);color:var(--accent);font-weight:600;cursor:not-allowed}
  .kpi{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px;text-align:center}
  .kpi .lbl{font-size:12px;color:var(--muted);margin-bottom:6px}
  .kpi .val{font-size:19px;font-weight:700;color:var(--txt);direction:ltr;font-family:monospace;letter-spacing:-.3px}
  .kpi .val.pos{color:var(--ok)}.kpi .val.neg{color:var(--danger)}.kpi .val.gold{color:var(--gold)}.kpi .val.acc{color:var(--accent)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead{background:var(--panel2)}
  th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line)}
  html[dir="ltr"] th,html[dir="ltr"] td{text-align:left}
  th{color:var(--accent);font-weight:600;font-size:12px}
  tbody tr:hover{background:rgba(34,193,164,.05)}
  td.num{direction:ltr;text-align:left;font-family:monospace}
  html[dir="ltr"] td.num{text-align:right}
  td.neg{color:var(--danger)}td.pos{color:var(--ok)}
  .monthPills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
  .monthPills button{background:var(--panel2);border:1px solid var(--line);color:var(--muted);padding:7px 14px;border-radius:20px;cursor:pointer;font-size:13px;position:relative;transition:.2s}
  .monthPills button.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
  .monthPills button:hover:not(.active){color:var(--txt)}
  .monthPills button.hasData::after{content:"●";color:var(--ok);font-size:9px;position:absolute;top:4px;left:6px}
  .muted{color:var(--muted);font-size:12px}
  .notice-bhd{display:flex;align-items:center;gap:8px;padding:10px 14px;margin-bottom:14px;background:rgba(234,179,8,.1);border:1px solid rgba(234,179,8,.35);border-radius:8px;color:var(--gold);font-size:13px;font-weight:600}
  .notice-int{display:flex;align-items:center;gap:8px;padding:8px 14px;margin-bottom:12px;background:rgba(34,193,164,.08);border:1px solid rgba(34,193,164,.3);border-radius:8px;color:var(--accent);font-size:12px;font-weight:600}
  .toast{position:fixed;bottom:20px;left:20px;background:var(--accent);color:#fff;padding:12px 20px;border-radius:10px;font-weight:600;box-shadow:0 8px 24px var(--shadow);opacity:0;transform:translateY(20px);transition:.3s;pointer-events:none;z-index:200}
  .toast.show{opacity:1;transform:none}
  .icon-btn{background:transparent;border:1px solid var(--line);color:var(--muted);width:30px;height:30px;border-radius:6px;cursor:pointer;font-size:14px;transition:.2s}
  .icon-btn:hover{border-color:var(--danger);color:var(--danger)}
  .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
  .badge.green{background:rgba(34,197,94,.15);color:var(--ok)}
  .badge.red{background:rgba(239,68,68,.15);color:var(--danger)}
  .badge.blue{background:rgba(59,130,246,.15);color:var(--accent2)}
  .badge.gold{background:rgba(234,179,8,.15);color:var(--gold)}
  .badge.purple{background:rgba(168,85,247,.15);color:#c084fc}
  .badge.fully-paid{background:rgba(34,197,94,.2);color:var(--ok);border:1px solid var(--ok);font-size:10px;padding:2px 6px;margin-inline-start:6px;font-weight:700}
  .card.eid-card{border:2px solid var(--gold);background:linear-gradient(180deg,rgba(234,179,8,.18),rgba(234,179,8,.06));box-shadow:0 0 0 3px rgba(234,179,8,.15);transition:.3s}
  .card.eid-card h2.eid-title{color:#111827;background:var(--gold);border-bottom-color:rgba(0,0,0,.15);padding:8px 12px;border-radius:6px;font-weight:700;font-size:14px;line-height:1.4}
  .card.eid-card h2.eid-title::before{content:"⚠";color:#7c2d12;font-size:14px}
  .card.eid-card .field label{color:#facc15;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.4)}
  .card.eid-card .field select,.card.eid-card .field input{border-color:var(--gold);background:rgba(20,25,35,.75);color:#fef3c7}
  .card.eid-card.eid-no{border-color:var(--ok);background:linear-gradient(180deg,rgba(34,197,94,.18),rgba(34,197,94,.06));box-shadow:0 0 0 3px rgba(34,197,94,.15)}
  .card.eid-card.eid-no h2.eid-title{background:var(--ok);color:#052e16}
  .card.eid-card.eid-no h2.eid-title::before{color:#052e16}
  .card.eid-card.eid-no .field label{color:#86efac}
  .meat-status{display:flex;align-items:center;justify-content:center;padding:10px 12px;border-radius:8px;font-size:13px;font-weight:700;border:1.5px solid;transition:.25s;user-select:none;min-height:40px}
  .meat-status.meat-status-no{background:linear-gradient(180deg,#2a1416,rgba(239,68,68,.35));border-color:var(--danger);color:#ffdcdc}
  .meat-status.meat-status-yes{background:linear-gradient(180deg,#123322,rgba(34,197,94,.35));border-color:var(--ok);color:#d6ffe2}
  .expense-table-wrap{overflow-x:auto;border-radius:8px;border:1px solid var(--line)}
  .expense-table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
  .expense-table thead{background:var(--panel2)}
  .expense-table th{padding:10px 12px;text-align:right;color:var(--accent);font-size:11px;font-weight:700;border-bottom:2px solid var(--line);white-space:nowrap}
  html[dir="ltr"] .expense-table th{text-align:left}
  .expense-table td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
  .expense-table td:first-child{font-weight:600;color:var(--txt);white-space:nowrap;padding-right:14px}
  html[dir="ltr"] .expense-table td:first-child{padding-right:8px;padding-left:14px}
  .expense-table input,.expense-table select{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:7px 10px;border-radius:6px;font-size:13px;outline:none;transition:.2s;font-family:inherit}
  .expense-table input:focus,.expense-table select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(34,193,164,.15)}
  .expense-table tr.excluded{background:rgba(239,68,68,.06)}
  .expense-table tr.excluded td:first-child{color:var(--danger);text-decoration:line-through;opacity:.75}
  .bank-excluded{background:rgba(239,68,68,.15) !important;border-color:var(--danger) !important;color:#ffdcdc !important}
  .expense-table tr.group-header{background:linear-gradient(90deg,rgba(59,130,246,.15),transparent)}
  .expense-table tr.group-header td{color:var(--accent2);font-weight:700;font-size:12px;padding:8px 14px;border-bottom:1px dashed var(--line)}
  .birthday-cell{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .birthday-cell select{max-width:110px;padding:5px 8px !important;font-size:12px !important;background:rgba(234,179,8,.1) !important;border-color:var(--gold) !important;color:#facc15 !important}
  .expense-table tr.bday-row{background:rgba(234,179,8,.04)}
  .expense-summary{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;padding:14px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;font-size:13px}
  .exp-sum-item{display:flex;gap:8px;align-items:center;padding:6px 12px;border-radius:8px;background:var(--panel);border:1px solid var(--line)}
  .exp-sum-item span{color:var(--muted)}
  .exp-sum-item b{color:var(--txt);font-family:monospace;font-size:14px}
  .exp-sum-item.green{border-color:rgba(34,197,94,.35)}.exp-sum-item.green b{color:var(--ok)}
  .exp-sum-item.red{border-color:rgba(239,68,68,.35)}.exp-sum-item.red b{color:var(--danger)}
  .exp-sum-divider{width:100%;height:1px;background:var(--line);margin:6px 0}
  .exp-sum-title{width:100%;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:4px}
  .bank-item{transition:.2s;min-width:150px}
  .bank-item:hover{transform:translateY(-2px);box-shadow:0 4px 12px var(--shadow)}
  .bank-item.bank-card{border-color:rgba(34,193,164,.4)}.bank-item.bank-card b{color:var(--accent)}
  .bank-item.bank-nbk{border-color:rgba(59,130,246,.4)}.bank-item.bank-nbk b{color:var(--accent2)}
  .bank-item.bank-ila{border-color:rgba(168,85,247,.4)}.bank-item.bank-ila b{color:#c084fc}
  .bank-item.bank-bbk{border-color:rgba(249,115,22,.4)}.bank-item.bank-bbk b{color:#fb923c}
  .bank-item.bank-meem{border-color:rgba(20,184,166,.4)}.bank-item.bank-meem b{color:#2dd4bf}
  .bank-item.bank-nbb{border-color:rgba(234,179,8,.4)}.bank-item.bank-nbb b{color:var(--gold)}
  .bank-item.bank-excl{border-color:rgba(239,68,68,.5);background:rgba(239,68,68,.08)}.bank-item.bank-excl b{color:var(--danger)}
  .saving-card{border:2px solid var(--accent);background:linear-gradient(180deg,rgba(34,193,164,.1),transparent)}
  .saving-card h2{color:var(--accent)}
  .saving-field input{font-weight:700;color:var(--accent);text-align:center;font-size:16px}
  .eid-type-inline{display:flex;gap:6px;margin-top:6px}
  .eid-type-inline select{flex:1;background:rgba(234,179,8,.1);border:1px solid var(--gold);color:#facc15;font-weight:700;padding:5px 8px;border-radius:6px;font-size:11px;cursor:pointer}
  .debts-month-card{border:2px solid var(--accent2);background:linear-gradient(180deg,rgba(59,130,246,.08),transparent)}
  .debts-month-card h2{color:var(--accent2)}
  .debts-month-wrap{overflow-x:auto;border-radius:8px;border:1px solid var(--line)}
  .debts-month-table{width:100%;border-collapse:collapse;font-size:13px;min-width:720px}
  .debts-month-table thead{background:var(--panel2)}
  .debts-month-table th{padding:9px 10px;text-align:right;color:var(--accent2);font-size:11px;font-weight:700;border-bottom:2px solid var(--line);white-space:nowrap}
  html[dir="ltr"] .debts-month-table th{text-align:left}
  .debts-month-table td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
  .debts-month-table input{width:110px;background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:7px 10px;border-radius:6px;font-size:14px;font-weight:700;outline:none;transition:.2s;font-family:monospace;text-align:center}
  .debts-month-table input:focus{box-shadow:0 0 0 3px rgba(34,193,164,.15)}
  .debts-month-table input.input-debit{border-color:var(--ok);color:var(--ok);background:rgba(34,197,94,.08)}
  .debts-month-table input.input-credit{border-color:var(--danger);color:var(--danger);background:rgba(239,68,68,.08)}
  .debts-month-table tr.row-debit{background:rgba(34,197,94,.04)}
  .debts-month-table tr.row-credit{background:rgba(239,68,68,.04)}
  .debts-month-table tr.row-installment{background:rgba(59,130,246,.04)}
  .debts-month-table .debt-name{font-weight:700;white-space:nowrap}
  .debts-month-table tfoot td{background:rgba(59,130,246,.1);font-weight:700;border-top:2px solid var(--accent2);padding:10px}
  .debts-table-wrap{overflow-x:auto;border-radius:8px;border:1px solid var(--line)}
  .debts-table{width:100%;border-collapse:collapse;font-size:12px;min-width:1600px}
  .debts-table thead{background:var(--panel2);position:sticky;top:0;z-index:2}
  .debts-table th{padding:8px 6px;text-align:center;color:var(--accent);font-size:10px;font-weight:700;border-bottom:2px solid var(--line);white-space:nowrap}
  .debts-table td{padding:5px 4px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}
  .debts-table input[type="number"]{width:58px;background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:4px 3px;border-radius:4px;text-align:center;font-size:11px;font-family:monospace;outline:none}
  .debts-table .paid-cell{font-family:monospace;font-weight:700;color:var(--accent);direction:ltr;font-size:12px}
  .debts-table .remain-cell{font-family:monospace;font-weight:700;direction:ltr;font-size:12px}
  .debts-table .remain-cell.pos{color:var(--ok)}
  .debts-table .remain-cell.neg{color:var(--danger)}
  .debts-table tfoot td{background:rgba(34,193,164,.08);font-weight:700;padding:8px 6px;border-top:2px solid var(--accent)}
  .debts-table tr.fully-paid-row{opacity:.72;background:rgba(34,197,94,.05)}
  .debts-table .inline-input{width:100%;background:transparent;border:1px solid transparent;color:var(--txt);padding:5px 6px;border-radius:4px;font-size:12px;font-family:inherit;text-align:right;transition:.15s;outline:none}
  html[dir="ltr"] .debts-table .inline-input{text-align:left}
  .debts-table .inline-input:hover{border-color:var(--line);background:var(--panel2)}
  .debts-table .inline-input:focus{border-color:var(--accent);background:var(--bg);box-shadow:0 0 0 2px rgba(34,193,164,.2)}
  .debts-table .inline-input.name{font-weight:700;min-width:120px}
  .debts-table .inline-input.num{text-align:center;font-family:monospace;direction:ltr;font-weight:700;min-width:70px}
  .debts-table .inline-input.num.paid-before{color:var(--muted);font-weight:600}
  .debts-table .inline-input.notes{font-size:11px;color:var(--muted);min-width:100px}
  .debts-table .inline-select{background:transparent;border:1px solid transparent;color:var(--txt);padding:5px 4px;border-radius:4px;font-size:11px;font-weight:600;cursor:pointer;outline:none;width:100%}
  .debts-table .inline-select:hover{border-color:var(--line);background:var(--panel2)}
  .debts-table .inline-select:focus{border-color:var(--accent);background:var(--bg);box-shadow:0 0 0 2px rgba(34,193,164,.2)}
  .debts-table .inline-select.type-sel{color:var(--accent);text-align:center}
  .fully-paid-badge-wrap{text-align:center;margin-top:2px;min-height:14px}
  .pyramid-wrap{display:flex;justify-content:center;align-items:center;padding:20px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;margin-bottom:16px}
  .pyramid-svg{max-width:640px;width:100%;height:auto}
  .pyramid-svg text{font-family:"Segoe UI","Tahoma",sans-serif;pointer-events:none;user-select:none}
  .pyramid-legend{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
  @media(max-width:768px){.pyramid-legend{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:500px){.pyramid-legend{grid-template-columns:1fr}}
  .pyr-legend-item{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel2);border:1px solid var(--line);border-radius:10px}
  .pyr-color{width:16px;height:16px;border-radius:4px;flex-shrink:0}
  .pyr-legend-item .pyr-label{font-size:12px;color:var(--muted);flex:1}
  .pyr-legend-item .pyr-val{font-family:monospace;font-weight:700;color:var(--txt);font-size:14px;direction:ltr}
  @media(max-width:768px){.expense-table{min-width:520px;font-size:12px}.expense-table th,.expense-table td{padding:5px 6px}.bank-item{min-width:120px;font-size:11px}.debts-month-table{min-width:600px}}
  .excluded-cell{color:var(--danger) !important;text-decoration:line-through;opacity:.65;font-size:12px}
  .year-chart{display:flex;gap:16px;align-items:flex-end;justify-content:center;padding:20px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;min-height:280px;overflow-x:auto}
  .year-bar-wrap{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:80px}
  .year-bar-group{display:flex;gap:4px;align-items:flex-end;height:200px}
  .year-bar{width:20px;border-radius:4px 4px 0 0;transition:.4s;position:relative;min-height:2px}
  .year-bar.inc{background:linear-gradient(180deg,var(--accent),#0d9488)}
  .year-bar.exp{background:linear-gradient(180deg,var(--danger),#991b1b)}
  .year-bar.sav{background:linear-gradient(180deg,var(--gold),#92400e)}
  .year-bar.rem{background:linear-gradient(180deg,var(--accent2),#1e40af)}
  .year-bar:hover{opacity:.85;transform:scaleY(1.02)}
  .year-bar-label{font-size:14px;font-weight:700;color:var(--gold)}
  .year-bar-legend{display:flex;gap:16px;justify-content:center;margin-top:12px;flex-wrap:wrap;font-size:12px}

<body>

<div class="print-header">
  <div class="logo-m">M</div>
  <h1 id="phTitle">نظام إدارة رأس المال</h1>
  <div class="subtitle" id="phSubtitle">Capital Manager — تقرير مالي</div>
  <div class="meta" id="phMeta">—</div>
</div>

<header>
  <h1><span>💰</span> <span id="appTitle">نظام إدارة رأس المال</span></h1>
  <div class="toolbar">
    <div class="save-indicator" id="saveIndicator" title="حالة الحفظ">💾 ...</div>
    <div class="year-picker">
      <button onclick="yearPrev()" title="Previous year">◀</button>
      <select id="yearSelect" onchange="selectYear(parseInt(this.value))"></select>
      <button onclick="yearNext()" title="Next year">▶</button>
      <button onclick="addYear()" title="Add year">➕</button>
      <button onclick="deleteYear()" title="Delete year">🗑</button>
    </div>
    <div class="settings-bar">
      <button onclick="toggleLang()" id="langBtn">🌐 EN</button>
      <button onclick="toggleTheme()" id="themeBtn">🌙</button>
      <button onclick="changeFontSize(-1)">A−</button>
      <button onclick="changeFontSize(1)">A+</button>
      <button onclick="printPage()" id="printBtn">🖨️</button>
    </div>
    <button class="btn" onclick="exportData()" id="btnExport">📤 تصدير</button>
    <button class="btn" onclick="document.getElementById('importFile').click()" id="btnImport">📥 استيراد</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
    <button class="btn danger" onclick="resetAll()" id="btnReset">🗑 تصفير</button>
  </div>
</header>

<nav class="tabs">
  <button data-view="dashboard" class="active" data-i18n="t_dash">📊 اللوحة الرئيسية</button>
  <button data-view="month" data-i18n="t_month">📅 إدخال الشهور</button>
  <button data-view="pyramid" data-i18n="t_pyr">🔺 هرم الأمان المالي</button>
  <button data-view="debts" data-i18n="t_debts">🤝 السلف والديون</button>
  <button data-view="annual" data-i18n="t_annual">📈 الملخص السنوي</button>
  <button data-view="years" data-i18n="t_years">📆 مقارنة السنوات</button>
</nav>

<main id="mainContent">

<section id="dashboard" class="view active">
  <div class="card"><h2 id="dashTitle1"></h2><div class="grid g4" id="dashKpis"></div></div>
  <div class="card"><h2 id="dashTitle2"></h2><div class="grid g4" id="dashDist"></div></div>
  <div class="card"><h2 id="dashTitle3"></h2><div class="grid g4" id="dashDebts"></div></div>
  <div class="card"><h2 id="dashTitle4"></h2><div style="overflow-x:auto"><table id="dashTable"></table></div></div>
</section>

<section id="month" class="view">
  <div class="monthPills" id="monthPills"></div>
  <div class="notice-bhd" id="noticeBhd"></div>
  <div class="card" style="border-color:var(--accent)">
    <h2 style="color:var(--accent)" id="dateTitle"></h2>
    <div class="grid g3">
      <div class="field"><label id="lblDate"></label><input type="date" id="monthDatePicker" oninput="setMonthDate(this.value)"></div>
      <div class="field"><label id="lblTime"></label><input type="time" id="monthTimePicker" oninput="setMonthTime(this.value)"></div>
      <div class="field"><label id="lblLastMod"></label><input type="text" id="lastModifiedDisplay" readonly></div>
    </div>
  </div>
  <div class="card">
    <h2><span id="lblIncome"></span> — <span id="monthTitle" style="color:var(--gold)"></span></h2>
    <div class="grid g4" id="incomeFields"></div>
  </div>
  <div class="card eid-card">
    <h2 class="eid-title" id="eidTitle"></h2>
    <div class="grid g2">
      <div class="field"><label id="lblEidState"></label>
        <select id="eidSelect" onchange="onEidChange(this.value)">
          <option value="eid_money" data-i18n="eid_opt1">عيادي+ عيادي عيالي</option>
          <option value="clothes" data-i18n="eid_opt2">ثياب العيد</option>
          <option value="both" data-i18n="eid_opt3">عيادي ، عيادي عيالي + ثياب العيد</option>
          <option value="no" data-i18n="eid_opt4">لا</option>
        </select>
      </div>
      <div class="field" id="eidAmountWrap" style="display:none"><label id="lblEidAmount"></label>
        <input type="number" id="eidAmountInput" oninput="upd('eidAmount', this.value)"></div>
    </div>
  </div>
  <div class="card">
    <h2 id="lblExpenses"></h2>
    <div class="expense-table-wrap">
      <table class="expense-table">
        <thead><tr><th id="thItem"></th><th id="thAmount"></th><th id="thBank"></th><th id="thNote"></th></tr></thead>
        <tbody id="expenseFields"></tbody>
      </table>
    </div>
    <div class="expense-summary" id="expenseSummary"></div>
  </div>
  <div class="card debts-month-card">
    <h2><span id="lblDebtsMonth"></span> — <span id="debtsMonthTitle" style="color:var(--accent2)"></span></h2>
    <p class="muted" style="margin-bottom:12px" id="debtsMonthHelp"></p>
    <div class="debts-month-wrap">
      <table class="debts-month-table">
        <thead><tr>
          <th id="thDebtName"></th><th id="thDebtType"></th><th id="thDebtTotal"></th>
          <th id="thDebtRemBefore"></th><th id="thDebtThisMonth"></th>
          <th id="thDebtRemAfter"></th><th id="thDebtNote"></th>
        </tr></thead>
        <tbody id="debtsMonthBody"></tbody>
        <tfoot id="debtsMonthFoot"></tfoot>
      </table>
    </div>
    <div class="expense-summary" id="debtsMonthSummary"></div>
  </div>
  <div class="card saving-card">
    <h2 id="lblSavings"></h2>
    <div class="notice-int" id="savingsHint"></div>
    <div class="grid g3" id="savingFields"></div>
  </div>
  <div class="card"><h2 id="lblMonthResult"></h2><div class="grid g4" id="monthResults"></div></div>
  <div class="card"><h2 id="lblMonthNotes"></h2>
    <div class="field"><textarea id="monthNotes" rows="4" oninput="updateMonthNotes(this.value)"></textarea></div>
  </div>
</section>

<section id="pyramid" class="view">
  <div class="card">
    <h2 id="lblPyrTitle"></h2>
    <p class="muted" style="margin-bottom:14px" id="lblPyrDesc"></p>
    <div class="pyramid-wrap"><svg class="pyramid-svg" viewBox="0 0 500 460" xmlns="http://www.w3.org/2000/svg" id="pyramidSvg"></svg></div>
    <div class="pyramid-legend" id="pyramidLegend"></div>
  </div>
  <div class="card"><h2 id="lblPyrDetail"></h2><div style="overflow-x:auto"><table id="pyramidTable"></table></div></div>
</section>

<section id="debts" class="view">
  <div class="card"><h2 id="lblDebtsSummary"></h2><div class="grid g4" id="debtsSummary"></div></div>
  <div class="card">
    <h2 id="lblAddDebt"></h2>
    <div class="grid g4">
      <div class="field"><label id="lblDebtName"></label><input id="d_name"></div>
      <div class="field"><label id="lblDebtType"></label>
        <select id="d_type" onchange="onDebtTypeChange(this.value)">
          <option value="credit" data-i18n="dbt_credit">🔴 دائن (أنا آخذ سلفة — أدفع)</option>
          <option value="debit" data-i18n="dbt_debit">🟢 مدين (ناس آخذين مني — أستلم)</option>
          <option value="installment" data-i18n="dbt_inst">🏦 قسط (بنك/فيزا — أدفع)</option>
        </select>
      </div>
      <div class="field" id="d_categoryWrap" style="display:none"><label id="lblDebtCat"></label>
        <select id="d_category">
          <option value="فيزا" data-i18n="dbt_visa">بطاقة فيزا</option>
          <option value="بنك" data-i18n="dbt_bank">بنك</option>
          <option value="متنوع" data-i18n="dbt_misc">متنوع</option>
        </select>
      </div>
      <div class="field"><label id="lblDebtTotal"></label><input id="d_total" type="number" min="0"></div>
      <div class="field"><label id="lblDebtPaidBefore"></label><input id="d_paidBefore" type="number" min="0"></div>
      <div class="field"><label id="lblDebtStart"></label><input id="d_start" type="date"></div>
      <div class="field"><label id="lblDebtEnd"></label><input id="d_end" type="date"></div>
      <div class="field"><label id="lblDebtNotes"></label><input id="d_notes"></div>
      <div class="field"><label>&nbsp;</label><button class="btn primary" onclick="addDebt()" id="btnAddDebt"></button></div>
    </div>
  </div>
  <div class="card">
    <h2 id="lblDebtsTable"></h2>
    <p class="muted" style="margin-bottom:12px" id="lblDebtsTableHint"></p>
    <div class="debts-table-wrap"><table class="debts-table" id="debtsTable"></table></div>
  </div>
</section>

<section id="annual" class="view">
  <div class="card"><h2 id="lblAnnualTitle"></h2><div style="overflow-x:auto"><table id="annualTable"></table></div></div>
</section>

<section id="years" class="view">
  <div class="card"><h2 id="lblYearsKpi"></h2><div class="grid g4" id="yearsKpis"></div></div>
  <div class="card">
    <h2 id="lblYearsChart"></h2>
    <div class="year-chart" id="yearsChart"></div>
    <div class="year-bar-legend">
      <div><span class="dot" style="background:linear-gradient(180deg,var(--accent),#0d9488)"></span><span data-i18n="y_inc"></span></div>
      <div><span class="dot" style="background:linear-gradient(180deg,var(--danger),#991b1b)"></span><span data-i18n="y_exp"></span></div>
      <div><span class="dot" style="background:linear-gradient(180deg,var(--gold),#92400e)"></span><span data-i18n="y_sav"></span></div>
      <div><span class="dot" style="background:linear-gradient(180deg,var(--accent2),#1e40af)"></span><span data-i18n="y_rem"></span></div>
    </div>
  </div>
  <div class="card"><h2 id="lblYearsTable"></h2><div style="overflow-x:auto"><table id="yearsTable"></table></div></div>
  <div class="card"><h2 id="lblYearsDist"></h2><div style="overflow-x:auto"><table id="yearsDistTable"></table></div></div>
</section>

</main>

<footer class="site-footer">
  <div class="copyright"><span class="logo-m">M</span><span>© 2025 <strong>Muharraqi</strong> — All Rights Reserved</span></div>
  <div style="margin-top:4px" id="footerLocalized"></div>
</footer>

function testStorage(){

    localStorage.setItem(k, "1");
    localStorage.removeItem(k);
    return true;
  }catch(e){ return false; }

function save(){
  if(!STORAGE_OK) return;
  try{
    localStorage.setItem(KEY, JSON.stringify(state));
    LAST_SAVE = new Date();
    updateSaveIndicator(true);
  }catch(e){
    console.error("Save failed:", e);
    updateSaveIndicator(false, e.message);
    if(e.name === "QuotaExceededError"){
      toast(LANG==='ar'?'⚠️ مساحة التخزين ممتلئة':'⚠️ Storage full');
    }
  }
}

function updateSaveIndicator(ok, err){
  const el = document.getElementById("saveIndicator");
  if(!el) return;
  if(ok && LAST_SAVE){
    const d = LAST_SAVE;
    const hh = String(d.getHours()).padStart(2,'0');
    const mm = String(d.getMinutes()).padStart(2,'0');
    const ss = String(d.getSeconds()).padStart(2,'0');
    el.textContent = "💾 " + t('save_ok') + `${hh}:${mm}:${ss}`;
    el.style.color = "var(--ok)";
  } else if(!ok){
    el.textContent = "⚠️ " + t('save_fail') + (err||"");
    el.style.color = "var(--danger)";
  }
}

function load(){
  STORAGE_OK = testStorage();
  if(!STORAGE_OK){
    setTimeout(() => alert(t('storage_warning')), 500);
    return;
  }
  try{
    let raw = localStorage.getItem(KEY);
    let migratedFrom = null;
    if(!raw){
      for(const oldKey of OLD_KEYS){
        const oldRaw = localStorage.getItem(oldKey);
        if(oldRaw){ raw = oldRaw; migratedFrom = oldKey; break; }
      }
    }
    if(!raw) return;
    const d = JSON.parse(raw);
    if(d.months && !d.years){
      const y = new Date().getFullYear();
      state.years = { [y]: d.months };
      state.yearList = [y];
      state.activeYear = y;
      state.activeMonth = d.activeMonth || 0;
      state.debts = (d.debts||[]).map(dd => {
        const newD = {...dd};
        newD.monthlyByYear = { [y]: dd.monthly || Array(12).fill(0) };
        delete newD.monthly;
        return newD;
      });
      if(migratedFrom) setTimeout(() => save(), 100);
      return;
    }
    state = {...state, ...d};
    state.yearList = state.yearList || [];
    Object.keys(state.years||{}).forEach(y => {
      state.years[y] = (state.years[y]||[]).map(m => ({...EMPTY_MONTH(), ...m}));
      while(state.years[y].length < 12) state.years[y].push(EMPTY_MONTH());
    });
    state.debts = (state.debts||[]).map(dd => {
      if(!dd.monthlyByYear){
        const y = state.activeYear;
        dd.monthlyByYear = { [y]: dd.monthly || Array(12).fill(0) };
        delete dd.monthly;
      }
      return dd;
    });
    if(migratedFrom){
      setTimeout(() => {
        save();
        toast(t('migrate_ok') + ": " + migratedFrom);
      }, 400);
    }
  }catch(e){ console.error("Load error:", e); }
}

function initIfEmpty(){
  if(!state.yearList || !state.yearList.length){
    const y = new Date().getFullYear();
    state.years = { [y]: emptyYear() };

    state.activeYear = y;
  }
  if(!state.years[state.activeYear]) state.years[state.activeYear] = emptyYear();
}

function M(){ return state.years[state.activeYear] || emptyYear(); }
function Mof(year){ return state.years[year] || []; }

function ensureMeta(m){ if(!m.expenseMeta) m.expenseMeta = {}; return m.expenseMeta; }
function getMeta(m, key){
  const meta = ensureMeta(m);
  if(!meta[key]) meta[key] = { bank:"بطاقة صراف الالي", note:"" };
  return meta[key];
}
function isExcluded(m, key){ return getMeta(m, key).bank === EXCLUDED_BANK; }

function dm(d, year, mi){ return ((d.monthlyByYear?.[year]) || [])[mi] || 0; }
function setDm(d, year, mi, val){
  if(!d.monthlyByYear) d.monthlyByYear = {};
  if(!d.monthlyByYear[year]) d.monthlyByYear[year] = Array(12).fill(0);
  d.monthlyByYear[year][mi] = val;
}
function debtPaidInYear(d, year){
  const arr = d.monthlyByYear?.[year] || [];
  return arr.reduce((a,b)=>a+(+b||0),0);
}
function debtPaidAllYears(d){
  if(!d.monthlyByYear) return 0;
  return Object.values(d.monthlyByYear).reduce((s,arr)=>s+arr.reduce((a,b)=>a+(+b||0),0),0);
}
function debtPaidTotal(d){ return (+d.paidBefore||0) + debtPaidAllYears(d); }
function debtRemaining(d){ return Math.max(0,(+d.total||0) - debtPaidTotal(d)); }
function debtRemainingBefore(d, year, mi){
  let paid = (+d.paidBefore || 0);
  Object.keys(d.monthlyByYear||{}).forEach(y => {
    if(parseInt(y) < parseInt(year)) paid += (d.monthlyByYear[y]||[]).reduce((a,b)=>a+(+b||0),0);
  });
  const arr = d.monthlyByYear?.[year] || [];
  for(let i=0;i<mi;i++) paid += (+arr[i]||0);
  return Math.max(0, (+d.total||0) - paid);
}
function isDebtFullyPaid(d){ return debtRemaining(d) === 0; }
function shouldShowDebtInMonthlyEntry(d, year, mi){
  if(debtRemaining(d) > 0) return true;
  return dm(d, year, mi) > 0;
}

function totalDebtReceipts(year, mi){
  return state.debts.filter(d=>d.type==="debit").reduce((s,d)=>s+dm(d, year, mi), 0);
}
function totalDebtPayments(year, mi){
  return state.debts.filter(d=>d.type==="credit"||d.type==="installment").reduce((s,d)=>s+dm(d, year, mi), 0);
}
function totalDebtReceiptsYear(year){
  let s=0; for(let i=0;i<12;i++) s+=totalDebtReceipts(year, i); return s;
}
function totalDebtPaymentsYear(year){
  let s=0; for(let i=0;i<12;i++) s+=totalDebtPayments(year, i); return s;
}

function totalIncomeCore(m, mi){
  let sum = getIncomeFields().reduce((s,[k])=>s+(+m[k]||0),0);
  const hasMeat = (mi !== undefined) ? isMeatMonth(mi) : !!m.hasMeatSupport;
  if(hasMeat) sum += (+m.meat||0);
  return sum;
}
function totalIncome(m, mi, year){
  let sum = totalIncomeCore(m, mi);
  if(mi !== undefined && year !== undefined) sum += totalDebtReceipts(year, mi);
  return sum;
}
function totalExpenses(m){
  let s=0; getExpenseRows().forEach(r=>{ if(r.type==="group") return; if(!isExcluded(m,r.key)) s+=(+m[r.key]||0); }); return s;
}
function totalExcludedExpenses(m){
  let s=0; getExpenseRows().forEach(r=>{ if(r.type==="group") return; if(isExcluded(m,r.key)) s+=(+m[r.key]||0); }); return s;
}
function totalExpensesRaw(m){
  let s=0; getExpenseRows().forEach(r=>{ if(r.type==="group") return; s+=(+m[r.key]||0); }); return s;
}
function totalSavings(m){ return getSavingFields().reduce((s,[k])=>s+(+m[k]||0),0); }

function yearTotals(year){
  const months = Mof(year);
  let inc=0, exp=0, sav=0;
  months.forEach((m,i)=>{
    inc += totalIncome(m, i, year);
    exp += totalExpenses(m);
    sav += totalSavings(m);
  });
  const debtPay = totalDebtPaymentsYear(year);
  const debtRecv = totalDebtReceiptsYear(year);
  return { income:inc, expenses:exp, savings:sav, debtPay, debtRecv, net: inc - exp - sav - debtPay };
}
function allYearsTotals(){
  let inc=0, exp=0, sav=0, debtPay=0, debtRecv=0;
  state.yearList.forEach(y=>{
    const tot = yearTotals(y);
    inc += tot.income; exp += tot.expenses; sav += tot.savings; debtPay += tot.debtPay; debtRecv += tot.debtRecv;
  });
  return { income:inc, expenses:exp, savings:sav, debtPay, debtRecv, net: inc - exp - sav - debtPay, years: state.yearList.length };
}

function debtTotals(){
  const recv = state.debts.filter(d=>d.type==="debit").reduce((s,d)=>s+debtPaidAllYears(d),0);
  const pay = state.debts.filter(d=>d.type==="credit"||d.type==="installment").reduce((s,d)=>s+debtPaidAllYears(d),0);
  const remToMe = state.debts.filter(d=>d.type==="debit").reduce((s,d)=>s+debtRemaining(d),0);
  const remOnMe = state.debts.filter(d=>d.type==="credit"||d.type==="installment").reduce((s,d)=>s+debtRemaining(d),0);
  return {receiveThisYear:recv,payThisYear:pay,netThisYear:recv-pay,
    remainingToReceive:remToMe,remainingToPay:remOnMe,netRemaining:remToMe-remOnMe,
    totalDebt: state.debts.reduce((s,d)=>s+(+d.total||0),0)};
}

function inVal(v){
  if(v === 0 || v === '0' || v === '' || v === undefined || v === null) return '';
  const n = Number(v);
  if(isNaN(n) || n === 0) return '';
  return v;
}

  state.years[y] = emptyYear();
  state.yearList.push(y);
  state.yearList.sort((a,b)=>a-b);
  state.activeYear = y;
  save(); renderYearSelect(); renderAll();
  toast(t('y_added') + y);

function deleteYear(){
  if(state.yearList.length <= 1){ toast(t('y_cant_del')); return; }
  if(!confirm(`${t('y_confirm_del')} ${state.activeYear}?`)) return;
  const y = state.activeYear;
  delete state.years[y];
  state.yearList = state.yearList.filter(x=>x!==y);
  state.activeYear = state.yearList[state.yearList.length-1];
  save(); renderYearSelect(); renderAll();
  toast(t('y_deleted') + y);
}

function renderDebtsMonthSection(){
  const mi = state.activeMonth;
  const y = state.activeYear;
  const tbody = document.getElementById("debtsMonthBody");
  const tfoot = document.getElementById("debtsMonthFoot");
  const summary = document.getElementById("debtsMonthSummary");
  if(!tbody) return;
  const titleEl = document.getElementById("debtsMonthTitle");
  if(titleEl) titleEl.textContent = getMonths()[mi] + " " + y;
  const visibleDebts = state.debts.filter(d => shouldShowDebtInMonthlyEntry(d, y, mi));
  if(!visibleDebts.length){
    tbody.innerHTML = `<tr><td colspan="7" style="padding:20px;text-align:center;color:var(--muted)">${t('dms_empty')}</td></tr>`;
    tfoot.innerHTML = ""; summary.innerHTML = ""; return;
  }
  const typeIcon = {credit:"🔴", debit:"🟢", installment:"🏦"};
  const typeLabel = {credit:t('dt_credit'), debit:t('dt_debit'), installment:t('dt_inst')};
  const typeCls = {credit:"row-credit", debit:"row-debit", installment:"row-installment"};
  let recv = 0, pay = 0;
  tbody.innerHTML = visibleDebts.map(d => {
    const remBefore = debtRemainingBefore(d, y, mi);
    const thisMonth = dm(d, y, mi);

    return `<tr class="${typeCls[d.type]}" data-debt-row="${d.id}">

function renderPyramid(){
  const levels = getPyramidLevels();
  const months = M();
  const totals = {};
  levels.forEach(lvl => { totals[lvl.key] = months.reduce((s,m)=>s+(+m[lvl.key]||0),0); });
  const grandTotal = Object.values(totals).reduce((a,b)=>a+b,0);
  const apexY = 25, bottomY = 430, apexLeftX = 190, apexRightX = 310, baseLeftX = 20, baseRightX = 480;
  const sliceH = (bottomY - apexY) / levels.length;
  const leftAt = y => apexLeftX + (baseLeftX - apexLeftX) * (y - apexY) / (bottomY - apexY);
  const rightAt = y => apexRightX + (baseRightX - apexRightX) * (y - apexY) / (bottomY - apexY);
  let svg = "";
  levels.forEach((lvl, i) => {
    const yBot = bottomY - i * sliceH, yTop = yBot - sliceH;
    const x1 = leftAt(yTop), x2 = rightAt(yTop), x3 = rightAt(yBot), x4 = leftAt(yBot);
    const cx = (x1+x2+x3+x4)/4, cy = (yTop+yBot)/2;
    const amt = totals[lvl.key] || 0;
    const pct = grandTotal > 0 ? (amt/grandTotal*100) : 0;
    const fs = 12 - i * 0.5, afs = 11 - i * 0.4;
    svg += `
      <polygon points="${x1},${yTop} ${x2},${yTop} ${x3},${yBot} ${x4},${yBot}" fill="${lvl.color}" fill-opacity="0.88" stroke="${lvl.color}" stroke-width="1.5"/>
      <text x="${cx}" y="${cy - 6}" text-anchor="middle" fill="#fff" font-size="${fs}" font-weight="700">${lvl.subtitle} ${lvl.label}</text>
      <text x="${cx}" y="${cy + 7}" text-anchor="middle" fill="#fff" font-size="${afs}" font-weight="600" font-family="monospace">${fmt(amt)} ${LANG==='ar'?'د.ب':'BHD'}</text>
      <text x="${cx}" y="${cy + 18}" text-anchor="middle" fill="#fff" font-size="${afs - 1}" font-weight="500" opacity="0.85">${pct.toFixed(1)}%</text>
    `;
  });
  document.getElementById("pyramidSvg").innerHTML = svg;
  document.getElementById("pyramidLegend").innerHTML = levels.slice().reverse().map(lvl => `
    <div class="pyr-legend-item">
      <div class="pyr-color" style="background:${lvl.color}"></div>
      <div class="pyr-label">${lvl.subtitle} ${lvl.label}</div>
      <div class="pyr-val">${fmt(totals[lvl.key])} ${LANG==='ar'?'د.ب':'BHD'}</div>
    </div>
  `).join("");
  let html = `<thead><tr><th>${t('th_level')}</th><th>${t('th_item_name')}</th><th>${t('th_year_total')}</th><th>${t('th_pct')}</th></tr></thead><tbody>`;
  levels.slice().reverse().forEach((lvl, idx) => {
    const level = levels.length - idx;
    const amt = totals[lvl.key] || 0;
    const pct = grandTotal > 0 ? (amt/grandTotal*100) : 0;
    html += `<tr><td style="color:${lvl.color};font-weight:700">${level}</td><td>${lvl.subtitle} ${lvl.label}</td><td class="num" style="color:${lvl.color};font-weight:700">${money(amt)}</td><td class="num">${fmtPct(pct)}%</td></tr>`;
  });
  html += `<tr style="background:rgba(34,193,164,.1);font-weight:700"><td colspan="2">${t('th_total')}</td><td class="num" style="color:var(--accent);font-weight:700">${money(grandTotal)}</td><td class="num">100%</td></tr></tbody>`;
  document.getElementById("pyramidTable").innerHTML = html;
}

    <th style="min-width:120px">${t('lbl_debt_notes')}</th>`;
  months.forEach(m => { head += `<th style="width:60px">${m}</th>`; });
  head += `<th>${t('th_debt_this_month')}</th><th>${t('th_debt_rem_after')}</th><th></th></tr></thead>`;

  let body = `<tbody>`;
  state.debts.forEach(d => {
    const rc = d.type === "credit" ? "row-credit" : d.type === "debit" ? "row-debit" : "row-installment";
    const paid = debtPaidInYear(d, y), rem = debtRemaining(d);
    const fullyPaid = isDebtFullyPaid(d);
    const rowCls = fullyPaid ? rc + ' fully-paid-row' : rc;
    const paidBadge = fullyPaid ? `<span class="badge fully-paid">✅ ${t('debt_paid')}</span>` : '';

    body += `<tr class="${rowCls}" data-debt-id="${d.id}">
      <td>
        <input type="text" class="inline-input name"
               value="${(d.name||'').replace(/"/g,'&quot;')}"
               onchange="updDebtName(${d.id}, this.value)">
        <div class="fully-paid-badge-wrap">${paidBadge}</div>
      </td>
      <td>
        <select class="inline-select type-sel" onchange="updDebtType(${d.id}, this.value)">
          <option value="credit" ${d.type==='credit'?'selected':''}>🔴 ${t('dt_credit_label')}</option>
          <option value="debit" ${d.type==='debit'?'selected':''}>🟢 ${t('dt_debit_label')}</option>
          <option value="installment" ${d.type==='installment'?'selected':''}>🏦 ${t('dt_inst_label')}</option>
        </select>
      </td>
      <td>
        <select class="inline-select" onchange="updDebtCategory(${d.id}, this.value)">
          <option value="" ${!d.category?'selected':''}>—</option>
          <option value="فيزا" ${d.category==='فيزا'?'selected':''}>${t('dbt_visa')}</option>
          <option value="بنك" ${d.category==='بنك'?'selected':''}>${t('dbt_bank')}</option>
          <option value="متنوع" ${d.category==='متنوع'?'selected':''}>${t('dbt_misc')}</option>
        </select>
      </td>
      <td>
        <input type="number" class="inline-input num" value="${inVal(d.total)}" min="0" step="0.001"
               oninput="updDebtTotal(${d.id}, this.value)">
      </td>
      <td>
        <input type="number" class="inline-input num paid-before" value="${inVal(d.paidBefore)}" min="0" step="0.001"
               oninput="updDebtPaidBefore(${d.id}, this.value)">
      </td>
      <td>
        <input type="text" class="inline-input notes"
               value="${(d.notes||'').replace(/"/g,'&quot;')}"
               placeholder="..."
               onchange="updDebtNotes(${d.id}, this.value)">
      </td>`;

    for(let i=0;i<12;i++){
      body += `<td><input type="number" value="${inVal(dm(d,y,i))}" min="0" step="0.001" oninput="updDebtMonth(${d.id}, ${i}, this.value)"></td>`;
    }
    body += `<td class="paid-cell">${fmt(paid)}</td>
             <td class="remain-cell ${rem===0?'pos':'neg'}">${fmt(rem)}</td>
             <td><button class="icon-btn" onclick="delDebt(${d.id})">✕</button></td>
    </tr>`;
  });
  body += `</tbody>`;

  const mTotals = Array(12).fill(0);
  let tp = 0, tr = 0;
  state.debts.forEach(d=>{ for(let i=0;i<12;i++) mTotals[i] += dm(d,y,i); tp += debtPaidInYear(d,y); tr += debtRemaining(d); });
  let foot = `<tfoot><tr><td colspan="6">${t('dms_total')}</td>`;
  for(let i=0;i<12;i++) foot += `<td>${mTotals[i] > 0 ? fmt(mTotals[i]) : "—"}</td>`;
  foot += `<td class="paid-cell">${fmt(tp)}</td><td class="remain-cell">${fmt(tr)}</td><td></td></tr></tfoot>`;
  el.innerHTML = head + body + foot;
}

function renderYears(){
  const all = allYearsTotals();
  const totalY = state.yearList.length;
  let bestYear = null, bestRem = -Infinity;
  state.yearList.forEach(y => {
    const tot = yearTotals(y);
    if(tot.net > bestRem){ bestRem = tot.net; bestYear = y; }
  });
  const avgInc = totalY ? all.income / totalY : 0;

  document.getElementById("yearsKpis").innerHTML = `
    ${kpi(t('y_all') + " (" + t('y_inc') + ")", money(all.income), "acc")}
    ${kpi(t('y_all') + " (" + t('y_exp') + ")", money(all.expenses), "neg")}
    ${kpi(t('y_all') + " (" + t('y_sav') + ")", money(all.savings), "gold")}
    ${kpi(t('y_all') + " (" + t('y_rem') + ")", money(all.net), all.net>=0?"pos":"neg")}
    ${kpi(t('y_count'), totalY + " " + t('y_years'), "acc")}
    ${kpi(t('y_best_year'), bestYear ? (bestYear + " (" + money(bestRem) + ")") : "—", "gold")}
    ${kpi(t('y_avg_income'), money(avgInc), "acc")}
  `;

  const chart = document.getElementById("yearsChart");
  if(!state.yearList.length){ chart.innerHTML = ""; }
  else {
    const maxVal = Math.max(...state.yearList.map(y => {
      const tot = yearTotals(y);
      return Math.max(tot.income, tot.expenses, tot.savings, Math.abs(tot.net));
    }), 1);
    chart.innerHTML = state.yearList.map(y => {
      const tot = yearTotals(y);
      const h = v => Math.max(2, (v / maxVal) * 200);
      const isActive = y === state.activeYear;
      return `<div class="year-bar-wrap">
        <div class="year-bar-group">
          <div class="year-bar inc" style="height:${h(tot.income)}px" title="${t('y_inc')}: ${money(tot.income)}"></div>
          <div class="year-bar exp" style="height:${h(tot.expenses)}px" title="${t('y_exp')}: ${money(tot.expenses)}"></div>
          <div class="year-bar sav" style="height:${h(tot.savings)}px" title="${t('y_sav')}: ${money(tot.savings)}"></div>
          <div class="year-bar rem" style="height:${h(Math.abs(tot.net))}px" title="${t('y_rem')}: ${money(tot.net)}"></div>
        </div>
        <div class="year-bar-label" style="${isActive?'color:var(--accent);':''}cursor:pointer" onclick="selectYear(${y})">${y}</div>
      </div>`;
    }).join("");
  }

  let thtml = `<thead><tr>
    <th>${t('y_year')}</th><th>${t('y_inc')}</th><th>${t('y_exp')}</th>
    <th>${t('y_sav')}</th><th>${t('y_debtpay')}</th><th>${t('y_debtrecv')}</th>
    <th>${t('y_rem')}</th><th>${t('th_status')}</th>
  </tr></thead><tbody>`;
  state.yearList.forEach(y => {
    const tot = yearTotals(y);
    const isActive = y === state.activeYear;
    const status = tot.net >= 0 ? `<span class="badge green">${t('status_good')}</span>` : `<span class="badge red">${t('status_bad')}</span>`;
    thtml += `<tr style="${isActive?'background:rgba(34,193,164,.1);font-weight:700;':''}cursor:pointer" onclick="selectYear(${y})">
      <td style="font-weight:700;color:${isActive?'var(--accent)':'var(--gold)'}">${y} ${isActive?'●':''}</td>
      <td class="num">${money(tot.income)}</td>
      <td class="num">${money(tot.expenses)}</td>
      <td class="num">${money(tot.savings)}</td>
      <td class="num" style="color:var(--danger)">${money(tot.debtPay)}</td>
      <td class="num" style="color:var(--ok)">${money(tot.debtRecv)}</td>
      <td class="num ${tot.net>=0?'pos':'neg'}" style="font-weight:700">${money(tot.net)}</td>
      <td>${status}</td>
    </tr>`;
  });
  thtml += `<tr style="background:rgba(34,193,164,.15);font-weight:700;color:var(--accent)">
    <td>${t('y_all')}</td>
    <td class="num">${money(all.income)}</td>
    <td class="num">${money(all.expenses)}</td>
    <td class="num">${money(all.savings)}</td>
    <td class="num" style="color:var(--danger)">${money(all.debtPay)}</td>
    <td class="num" style="color:var(--ok)">${money(all.debtRecv)}</td>
    <td class="num ${all.net>=0?'pos':'neg'}" style="font-weight:700">${money(all.net)}</td>
    <td>—</td>
  </tr></tbody>`;
  document.getElementById("yearsTable").innerHTML = thtml;

  const sFields = getSavingFields();
  let dhtml = `<thead><tr><th>${t('th_item_name')}</th>${state.yearList.map(y=>`<th>${y}</th>`).join('')}<th>${t('th_total')}</th></tr></thead><tbody>`;
  sFields.forEach(f => {
    const [k, l] = f;
    const vals = state.yearList.map(y => Mof(y).reduce((s,m)=>s+(+m[k]||0),0));
    const sum = vals.reduce((a,b)=>a+b,0);
    dhtml += `<tr><td>${l}</td>${vals.map(v=>`<td class="num">${v?money(v):"—"}</td>`).join('')}<td class="num" style="color:var(--accent);font-weight:700">${money(sum)}</td></tr>`;
  });
  dhtml += `</tbody>`;
  document.getElementById("yearsDistTable").innerHTML = dhtml;
}

function renderAnnual(){
  const months = getMonths();
  const y = state.activeYear;
  const monthsData = M();
  const sections = [
    [t('lbl_income'), getIncomeFields().map(([k,l])=>({key:k, label:l}))],
    [t('lbl_expenses').replace('💸 ',''), getExpenseRows().filter(r=>r.type!=="group").map(r=>({key:r.key, label:r.label}))],
    [t('lbl_savings').replace('💰 ',''), getSavingFields().map(([k,l])=>({key:k, label:l}))],
  ];
  let html = `<thead><tr><th>${t('th_item')}</th>${months.map(m=>`<th>${m}</th>`).join("")}<th>${t('th_total')}</th></tr></thead><tbody>`;
  sections.forEach(([title, items])=>{
    html += `<tr style="background:var(--panel2)"><td colspan="14" style="color:var(--accent);font-weight:700">${title}</td></tr>`;
    items.forEach(({key, label})=>{
      const values = monthsData.map(m=>+m[key]||0);
      const counted = monthsData.map(m => {
        if(title.includes('المصاريف')||title.includes('Expenses')){ if(isExcluded(m, key)) return 0; }
        return +m[key]||0;
      });
      const sum = counted.reduce((a,b)=>a+b,0);
      html += `<tr><td>${label}</td>` +
        values.map((v, i)=>{
          const mm = monthsData[i];
          const isExp = title.includes('المصاريف')||title.includes('Expenses');
          const ex = isExp && isExcluded(mm, key);
          if(!v) return `<td class="num">—</td>`;
          return `<td class="num ${ex?'excluded-cell':''}">${money(v)}${ex?' ⛔':''}</td>`;
        }).join("") +
        `<td class="num" style="color:var(--accent);font-weight:700">${money(sum)}</td></tr>`;
    });
  });
  const drpm = months.map((_,i)=>totalDebtReceipts(y, i));
  const dppm = months.map((_,i)=>totalDebtPayments(y, i));
  html += `<tr style="background:var(--panel2)"><td colspan="14" style="color:var(--accent2);font-weight:700">🤝 ${t('lbl_debts_month')}</td></tr>`;
  html += `<tr><td>${t('dms_recv')}</td>${drpm.map(v=>`<td class="num" style="color:var(--ok)">${v?money(v):"—"}</td>`).join("")}<td class="num" style="color:var(--ok);font-weight:700">${money(drpm.reduce((a,b)=>a+b,0))}</td></tr>`;
  html += `<tr><td>${t('dms_pay')}</td>${dppm.map(v=>`<td class="num" style="color:var(--danger)">${v?money(v):"—"}</td>`).join("")}<td class="num" style="color:var(--danger);font-weight:700">${money(dppm.reduce((a,b)=>a+b,0))}</td></tr>`;
  const meatT = monthsData.map((m,i) => isMeatMonth(i) ? (+m.meat||0) : 0);
  html += `<tr style="background:var(--panel2)"><td colspan="14" style="color:var(--gold);font-weight:700">${t('f_meat_support')}</td></tr>`;
  html += `<tr><td>${t('f_meat_support')}</td>${meatT.map(v=>`<td class="num">${v?money(v):"—"}</td>`).join("")}<td class="num" style="color:var(--gold);font-weight:700">${money(meatT.reduce((a,b)=>a+b,0))}</td></tr>`;
  const eidT = monthsData.map(m => +m.eidAmount||0);
  html += `<tr style="background:var(--panel2)"><td colspan="14" style="color:var(--gold);font-weight:700">${t('mr_eid_ref')}</td></tr>`;
  html += `<tr><td>${t('mr_eid_ref')}</td>${eidT.map(v=>`<td class="num">${v?money(v):"—"}</td>`).join("")}<td class="num" style="color:var(--gold);font-weight:700">${money(eidT.reduce((a,b)=>a+b,0))}</td></tr>`;
  const inc = monthsData.map((m,i)=>totalIncome(m,i,y));
  const exp = monthsData.map(totalExpenses);
  const sav = monthsData.map(totalSavings);
  const rem = monthsData.map((m,i)=>inc[i]-exp[i]-sav[i]-dppm[i]);
  const rowSum = arr => arr.reduce((a,b)=>a+b,0);
  html += `<tr style="background:rgba(34,193,164,.1);font-weight:700"><td>${t('mr_inc_total')}</td>${inc.map(v=>`<td class="num">${money(v)}</td>`).join("")}<td class="num">${money(rowSum(inc))}</td></tr>`;
  html += `<tr style="background:rgba(239,68,68,.08);font-weight:700"><td>${t('mr_exp')}</td>${exp.map(v=>`<td class="num">${money(v)}</td>`).join("")}<td class="num">${money(rowSum(exp))}</td></tr>`;
  html += `<tr style="background:rgba(234,179,8,.08);font-weight:700"><td>${t('mr_saving')}</td>${sav.map(v=>`<td class="num">${money(v)}</td>`).join("")}<td class="num">${money(rowSum(sav))}</td></tr>`;
  html += `<tr style="background:rgba(34,197,94,.08);font-weight:700"><td>${t('mr_remaining')}</td>${rem.map(v=>`<td class="num ${v>=0?'pos':'neg'}">${money(v)}</td>`).join("")}<td class="num ${rowSum(rem)>=0?'pos':'neg'}">${money(rowSum(rem))}</td></tr>`;
  document.getElementById("annualTable").innerHTML = html + `</tbody>`;
}

document.querySelectorAll("nav.tabs button").forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.remove("active"));
    document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById(btn.dataset.view).classList.add("active");
    const v = btn.dataset.view;
    if(v==="dashboard") renderDashboard();
    if(v==="month") renderMonth();
    if(v==="years") renderYears();
    if(v==="pyramid") renderPyramid();
    if(v==="debts") renderDebts();
    if(v==="annual") renderAnnual();
  };
});

function exportData(){
  const blob = new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `capital_manager_${new Date().toISOString().slice(0,10)}.json`;
  a.click(); toast(t('exported'));
}
function importData(e){
  const file = e.target.files[0]; if(!file) return;
  const r = new FileReader();
  r.onload = ev => {
    try{ const d = JSON.parse(ev.target.result); if(d.years || d.months){ state = {...state, ...d}; save(); location.reload(); } }
    catch(err){ alert(t('invalid_file')); }
  };
  r.readAsText(file);
}
function resetAll(){
  if(!confirm(t('confirm_reset'))) return;
  localStorage.removeItem(KEY);
  OLD_KEYS.forEach(k => localStorage.removeItem(k));
  location.reload();
}

load();
initIfEmpty();
applyTheme();
applyFontScale();
applyLang();
save();
</script>
</body>
</html>
